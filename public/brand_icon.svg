<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Modern Vibrant Gradient matching allbgremove theme -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#brandGrad)" filter="url(#shadow)"/>

  <!-- Inner Soft Glow Border -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6"/>

  <!-- Camera Body -->
  <path d="M168 152 L200 120 L312 120 L344 152 L396 152 C418.1 152 436 169.9 436 192 L436 364 C436 386.1 418.1 404 396 404 L116 404 C93.9 404 76 386.1 76 364 L76 192 C76 169.9 93.9 152 116 152 Z" 
        fill="#ffffff" />

  <!-- Lens Outer Ring -->
  <circle cx="256" cy="278" r="88" fill="url(#brandGrad)" />

  <!-- Lens Inner Aperture / Portrait Flash -->
  <circle cx="256" cy="278" r="64" fill="#1e1b4b" />
  <circle cx="256" cy="278" r="42" fill="#4f46e5" opacity="0.6" />
  
  <!-- Lens Glare Reflection -->
  <circle cx="236" cy="258" r="16" fill="#ffffff" opacity="0.9" />
  <circle cx="268" cy="290" r="8" fill="#ffffff" opacity="0.5" />

  <!-- Camera Small Flash / Sensor Top Right -->
  <circle cx="380" cy="204" r="14" fill="#fbbf24" />

  <!-- Passport Biometric Alignment Corner Marks (Subtle White Accent) -->
  <path d="M 120 220 L 120 184 L 156 184" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"/>
  <path d="M 392 336 L 392 372 L 356 372" fill="none" stroke="#ec4899" stroke-width="8" stroke-linecap="round"/>
</svg>
