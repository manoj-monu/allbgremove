name: Build and Push Serverless Docker Image

on:
  push:
    paths:
      - 'serverless-backend/**'
      - '.github/workflows/build-docker.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/manoj-monu/passport-bg-remove:latest ./serverless-backend
          docker push ghcr.io/manoj-monu/passport-bg-remove:latest
